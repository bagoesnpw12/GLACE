<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-pid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0a1424"/>
  <rect width="100%" height="100%" fill="url(#grid-pid)"/>

  <!-- Frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Title Top -->
  <text x="50" y="55" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">DIAGRAM ALIR PROSES & INSTRUMENTASI (P&amp;ID) INSTALASI PENGOLAHAN LIMBAH (IPAL)</text>
  <text x="50" y="72" fill="#94a3b8" font-family="monospace" font-size="10">KAPASITAS DESAIN: 1,200 m³/HARI | BAKU MUTU EFFLUENT PERMEN LHK 16/2019</text>

  <!-- Feed Line Inflow -->
  <line x1="40" y1="180" x2="110" y2="180" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="110,180 100,175 100,185" fill="#f59e0b"/>
  <text x="40" y="165" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">RAW EFFLUENT</text>

  <!-- Tank 1: Bak Ekualisasi T-101 -->
  <rect x="110" y="140" width="100" height="130" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="120" y="165" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">BAK EKUALISASI</text>
  <text x="135" y="180" fill="#94a3b8" font-family="monospace" font-size="9">T-101 (250 m³)</text>
  <!-- Level Transmitter Instrument Bubble LT-101 -->
  <circle cx="160" cy="110" r="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="146" y1="110" x2="174" y2="110" stroke="#22c55e" stroke-width="1"/>
  <text x="152" y="106" fill="#22c55e" font-family="monospace" font-size="8">LT</text>
  <text x="150" y="120" fill="#22c55e" font-family="monospace" font-size="8">101</text>
  <line x1="160" y1="124" x2="160" y2="140" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Pump P-101A/B -->
  <line x1="210" y1="230" x2="260" y2="230" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="280" cy="230" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="275,215 295,230 275,245" fill="#38bdf8"/>
  <text x="260" y="265" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="bold">P-101A/B</text>

  <!-- Chemical Dosing (PAC & Polimer) -->
  <line x1="330" y1="100" x2="330" y2="230" stroke="#a855f7" stroke-width="2"/>
  <circle cx="330" cy="85" r="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="323" y="90" fill="#a855f7" font-family="monospace" font-size="8">DOS</text>
  <text x="310" y="65" fill="#a855f7" font-family="monospace" font-size="8">PAC 10%</text>

  <!-- Tank 2: Clarifier / Kolam Koagulasi T-102 -->
  <line x1="300" y1="230" x2="370" y2="230" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="370" y="140" width="110" height="130" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="385" y="165" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">CLARIFIER</text>
  <text x="395" y="180" fill="#94a3b8" font-family="monospace" font-size="9">T-102 (180 m³)</text>
  <polygon points="380,270 425,320 470,270" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="395" y="340" fill="#94a3b8" font-family="monospace" font-size="8">SLUDGE CONE</text>

  <!-- Sludge Underflow to Belt Press -->
  <line x1="425" y1="320" x2="425" y2="400" stroke="#64748b" stroke-width="2.5"/>
  <text x="435" y="390" fill="#64748b" font-family="monospace" font-size="9">SLUDGE TO DEWATERING</text>

  <!-- Aeration Tank T-103 -->
  <line x1="480" y1="180" x2="540" y2="180" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="540" y="130" width="130" height="150" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="555" y="155" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">AERASI BIOLOGI</text>
  <text x="565" y="170" fill="#94a3b8" font-family="monospace" font-size="9">T-103 (600 m³)</text>

  <!-- Air Blower Diffusers in Aeration -->
  <line x1="560" y1="260" x2="650" y2="260" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="605" y1="320" x2="605" y2="260" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="605" cy="335" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="585" y="365" fill="#38bdf8" font-family="monospace" font-size="9">ROOTS BLOWER B-101</text>

  <!-- Dissolved Oxygen Transmitter DO-103 -->
  <circle cx="630" cy="100" r="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="616" y1="100" x2="644" y2="100" stroke="#22c55e" stroke-width="1"/>
  <text x="622" y="96" fill="#22c55e" font-family="monospace" font-size="8">DOT</text>
  <text x="620" y="110" fill="#22c55e" font-family="monospace" font-size="8">103</text>
  <line x1="630" y1="114" x2="630" y2="130" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Treated Water Effluent Outflow -->
  <line x1="670" y1="180" x2="740" y2="180" stroke="#22c55e" stroke-width="3"/>
  <polygon points="740,180 730,175 730,185" fill="#22c55e"/>
  <text x="660" y="210" fill="#22c55e" font-family="monospace" font-size="9" font-weight="bold">DISCHARGE KE SUNGAI</text>

  <!-- Title Block Bottom Right -->
  <rect x="520" y="400" width="250" height="70" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="530" y="418" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">GLACE PROCESS & ENVIRO</text>
  <text x="530" y="435" fill="#f8fafc" font-family="monospace" font-size="9">DWG: DWG-PR-WWTP-021 [REV A]</text>
  <text x="530" y="450" fill="#94a3b8" font-family="sans-serif" font-size="8">P&amp;ID SISTEM PENGOLAHAN AIR LIMBAH</text>
</svg>