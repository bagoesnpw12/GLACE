<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-civil" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.5"/>
    </pattern>
    <pattern id="rebar-hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="8" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0a1526"/>
  <rect width="100%" height="100%" fill="url(#grid-civil)"/>

  <!-- Drawing Frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Civil Section Cut Title -->
  <text x="50" y="55" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">POTONGAN A-A: PONDASI RAFT PILE TRAFO DAYA 60 MVA</text>
  <text x="50" y="72" fill="#94a3b8" font-family="monospace" font-size="10">MUTU BETON fc' = 30 MPa (K-350) | BAJA TULANGAN BjTS 420B</text>

  <!-- Ground Level Line -->
  <line x1="50" y1="170" x2="730" y2="170" stroke="#64748b" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="640" y="162" fill="#94a3b8" font-family="monospace" font-size="10">±0.00 MUKA TANAH</text>

  <!-- Raft Foundation Slab (Concrete Section) -->
  <rect x="120" y="170" width="560" height="90" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="125" y="175" width="550" height="80" fill="url(#rebar-hatch)"/>
  <text x="320" y="215" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">RAFT SLAB TEBAL 900 mm</text>

  <!-- Oil Catcher Pit (Bak Penampung Minyak Trafo) in the Center -->
  <polygon points="280,170 300,230 500,230 520,170" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="340" y="200" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">OIL CATCHER PIT (V = 28 m³)</text>
  <line x1="400" y1="230" x2="400" y2="280" stroke="#ef4444" stroke-width="2"/>
  <text x="410" y="260" fill="#ef4444" font-family="monospace" font-size="8">DRAIN TO OIL SEPARATOR DN150</text>

  <!-- Transformer Pedestal & Anchor Bolts -->
  <rect x="220" y="125" width="90" height="45" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <rect x="490" y="125" width="90" height="45" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <text x="235" y="152" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="bold">PEDESTAL 1</text>
  <text x="505" y="152" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="bold">PEDESTAL 2</text>
  <!-- Anchor Bolts D32 -->
  <line x1="240" y1="110" x2="240" y2="185" stroke="#f59e0b" stroke-width="3"/>
  <line x1="290" y1="110" x2="290" y2="185" stroke="#f59e0b" stroke-width="3"/>
  <line x1="510" y1="110" x2="510" y2="185" stroke="#f59e0b" stroke-width="3"/>
  <line x1="560" y1="110" x2="560" y2="185" stroke="#f59e0b" stroke-width="3"/>

  <!-- Spun Piles (Tiang Pancang Beton D500) -->
  <!-- Pile 1 -->
  <rect x="150" y="260" width="40" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="150,410 170,440 190,410" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

  <!-- Pile 2 -->
  <rect x="260" y="260" width="40" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="260,410 280,440 300,410" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

  <!-- Pile 3 -->
  <rect x="500" y="260" width="40" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="500,410 520,440 540,410" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

  <!-- Pile 4 -->
  <rect x="610" y="260" width="40" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="610,410 630,440 650,410" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

  <text x="140" y="460" fill="#38bdf8" font-family="monospace" font-size="9">SPUN PILE D500 (L=18m)</text>
  <text x="590" y="460" fill="#38bdf8" font-family="monospace" font-size="9">BEBAN IJIN = 145 TON</text>

  <!-- Dimension Arrow Markers -->
  <line x1="120" y1="110" x2="680" y2="110" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="120,110 130,107 130,113" fill="#f59e0b"/>
  <polygon points="680,110 670,107 670,113" fill="#f59e0b"/>
  <text x="360" y="105" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">PANJANG = 8,500 mm</text>

  <!-- Title Block Bottom Right -->
  <rect x="520" y="400" width="250" height="70" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="530" y="418" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">GLACE CIVIL & STRUCTURAL</text>
  <text x="530" y="435" fill="#f8fafc" font-family="monospace" font-size="9">DWG: DWG-CV-TRF-015 [REV B]</text>
  <text x="530" y="450" fill="#94a3b8" font-family="sans-serif" font-size="8">PONDASI RAFT PILE TRAFO 60 MVA</text>
</svg>