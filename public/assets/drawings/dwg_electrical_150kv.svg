<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-el" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e3a5f" stroke-width="0.7" opacity="0.4"/>
    </pattern>
    <pattern id="grid-el-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#2563eb" stroke-width="1.2" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Blueprint dark tone -->
  <rect width="100%" height="100%" fill="#0a192f"/>
  <rect width="100%" height="100%" fill="url(#grid-el)"/>
  <rect width="100%" height="100%" fill="url(#grid-el-major)"/>

  <!-- Title Block Frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>

  <!-- Switchyard 150kV SLD Elements -->
  <!-- 150kV Main Busbar 1 & 2 -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="#f59e0b" stroke-width="3"/>
  <text x="70" y="80" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">BUSBAR 1 - 150 kV (R-S-T)</text>

  <line x1="60" y1="120" x2="740" y2="120" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="70" y="140" fill="#fbbf24" font-family="monospace" font-size="11">BUSBAR 2 - CADANGAN 150 kV</text>

  <!-- Bay Penghantar 1 -->
  <line x1="160" y1="90" x2="160" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <!-- Disconnector DS-1 -->
  <circle cx="160" cy="180" r="5" fill="#0a192f" stroke="#38bdf8" stroke-width="2"/>
  <line x1="160" y1="185" x2="175" y2="170" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="185" y="180" fill="#94a3b8" font-family="monospace" font-size="9">DS-101</text>

  <!-- Circuit Breaker CB-1 -->
  <rect x="145" y="210" width="30" height="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 152 225 L 168 225" stroke="#ef4444" stroke-width="3"/>
  <text x="185" y="228" fill="#94a3b8" font-family="monospace" font-size="9">CB-101 SF6</text>

  <!-- Current Transformer CT-1 -->
  <line x1="160" y1="240" x2="160" y2="280" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="160" cy="270" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="160" cy="285" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="185" y="280" fill="#94a3b8" font-family="monospace" font-size="9">CT 1200/5A</text>

  <!-- Outgoing Line 1 -->
  <line x1="160" y1="293" x2="160" y2="390" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="160,410 150,390 170,390" fill="#38bdf8"/>
  <text x="110" y="430" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">LINE 1 BATANG</text>

  <!-- Bay Trafo Daya 60 MVA -->
  <line x1="400" y1="90" x2="400" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <rect x="385" y="195" width="30" height="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 392 210 L 408 210" stroke="#ef4444" stroke-width="3"/>

  <!-- Transformer Dual Winding Symbol -->
  <circle cx="400" cy="260" r="22" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="400" cy="295" r="22" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <text x="435" y="275" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">TRAFO 1 (60 MVA)</text>
  <text x="435" y="290" fill="#94a3b8" font-family="monospace" font-size="9">Dyn11 150/20 kV</text>

  <!-- 20kV Medium Voltage Incomer -->
  <line x1="400" y1="317" x2="400" y2="380" stroke="#a855f7" stroke-width="2.5"/>
  <rect x="385" y="380" width="30" height="25" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <line x1="330" y1="420" x2="470" y2="420" stroke="#a855f7" stroke-width="3"/>
  <text x="350" y="440" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold">BUSBAR 20 kV SWITCHGEAR</text>

  <!-- Bay Penghantar 2 -->
  <line x1="640" y1="90" x2="640" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <rect x="625" y="210" width="30" height="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 632 225 L 648 225" stroke="#ef4444" stroke-width="3"/>
  <line x1="640" y1="240" x2="640" y2="390" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="640,410 630,390 650,390" fill="#38bdf8"/>
  <text x="590" y="430" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">LINE 2 WELERI</text>

  <!-- Title Block Bottom Right -->
  <rect x="520" y="400" width="250" height="70" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="530" y="418" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">GLACE ENGINEERING PLATFORM</text>
  <text x="530" y="435" fill="#f8fafc" font-family="monospace" font-size="9">DWG: DWG-EL-WLR-001 [REV C]</text>
  <text x="530" y="450" fill="#94a3b8" font-family="sans-serif" font-size="8">SKALA: 1:100 | SINGLE LINE DIAGRAM 150kV</text>
</svg>