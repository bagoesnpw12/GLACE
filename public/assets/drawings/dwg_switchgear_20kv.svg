<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-sw" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0a1324"/>
  <rect width="100%" height="100%" fill="url(#grid-sw)"/>

  <!-- Frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Title Top -->
  <text x="50" y="55" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">TATA LETAK KUBIKEL PANEL SWITCHGEAR 20 kV RUANG KONTROL</text>
  <text x="50" y="72" fill="#94a3b8" font-family="monospace" font-size="10">TYPE TESTED IEC 62271-200 | INTERNAL ARC CLASSIFICATION AFLR 25 kA 1s</text>

  <!-- Cubicle 1: Incomer Trafo 1 -->
  <rect x="70" y="110" width="120" height="270" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="80" y="120" width="100" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="88" y="145" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">PANEL 01 (INCOMER)</text>
  <rect x="95" y="180" width="70" height="60" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="105" y="215" fill="#f59e0b" font-family="monospace" font-size="9">VCB 2500A</text>
  <!-- Metering Display -->
  <rect x="90" y="260" width="80" height="35" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="98" y="282" fill="#22c55e" font-family="monospace" font-size="9">20.2 kV | 1240 A</text>
  <text x="95" y="360" fill="#94a3b8" font-family="monospace" font-size="8">PT ABB UniGear ZS1</text>

  <!-- Cubicle 2: Outgoing Feeder 1 -->
  <rect x="205" y="110" width="115" height="270" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="215" y="120" width="95" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="225" y="145" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">PANEL 02 (FEEDER 1)</text>
  <rect x="228" y="180" width="70" height="60" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="240" y="215" fill="#f59e0b" font-family="monospace" font-size="9">VCB 630A</text>
  <rect x="223" y="260" width="80" height="35" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="235" y="282" fill="#22c55e" font-family="monospace" font-size="9">RELAY REF615</text>
  <text x="225" y="360" fill="#94a3b8" font-family="monospace" font-size="8">KAWASAN INDUSTRI 1</text>

  <!-- Cubicle 3: Outgoing Feeder 2 -->
  <rect x="335" y="110" width="115" height="270" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="345" y="120" width="95" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="355" y="145" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">PANEL 03 (FEEDER 2)</text>
  <rect x="358" y="180" width="70" height="60" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="370" y="215" fill="#f59e0b" font-family="monospace" font-size="9">VCB 630A</text>
  <rect x="353" y="260" width="80" height="35" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="365" y="282" fill="#22c55e" font-family="monospace" font-size="9">RELAY REF615</text>
  <text x="355" y="360" fill="#94a3b8" font-family="monospace" font-size="8">KAWASAN INDUSTRI 2</text>

  <!-- Cubicle 4: Bus Coupler -->
  <rect x="465" y="110" width="115" height="270" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="475" y="120" width="95" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="485" y="145" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">PANEL 04 (COUPLER)</text>
  <rect x="488" y="180" width="70" height="60" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="498" y="215" fill="#f59e0b" font-family="monospace" font-size="9">BUS COUPLER</text>
  <rect x="483" y="260" width="80" height="35" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="495" y="282" fill="#22c55e" font-family="monospace" font-size="9">SYNC RELAY</text>
  <text x="490" y="360" fill="#94a3b8" font-family="monospace" font-size="8">BUS SECTION 1-2</text>

  <!-- 20kV Main Copper Busbar Line Across All Panels -->
  <line x1="70" y1="130" x2="580" y2="130" stroke="#f59e0b" stroke-width="4"/>
  <text x="75" y="100" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">TEMBAGA BUSBAR 20 kV (3150 A)</text>

  <!-- Cable Trench (Parit Kabel Bawah) -->
  <rect x="50" y="395" width="550" height="35" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="60" y="418" fill="#94a3b8" font-family="monospace" font-size="9">TRENCH KABEL KELUAR 3 x (1x300 mm²) XLPE AL/CU KE OUTDOOR</text>

  <!-- Title Block Bottom Right -->
  <rect x="520" y="400" width="250" height="70" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="530" y="418" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">GLACE ELECTRICAL MEDIUM VOLTAGE</text>
  <text x="530" y="435" fill="#f8fafc" font-family="monospace" font-size="9">DWG: DWG-EL-SWG-012 [REV B]</text>
  <text x="530" y="450" fill="#94a3b8" font-family="sans-serif" font-size="8">TATA LETAK KUBIKEL PANEL 20 kV</text>
</svg>