<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-hvac" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <pattern id="insulation" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#0ea5e9" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0b1329"/>
  <rect width="100%" height="100%" fill="url(#grid-hvac)"/>

  <!-- Border Drawing Frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#0284c7" stroke-width="1.5"/>

  <!-- AHU (Air Handling Unit) Block -->
  <rect x="60" y="160" width="140" height="180" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="75" y="190" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">AHU-CL-03</text>
  <text x="75" y="208" fill="#94a3b8" font-family="monospace" font-size="9">Airflow: 4,500 CFM</text>
  <text x="75" y="224" fill="#94a3b8" font-family="monospace" font-size="9">Static Press: 650 Pa</text>
  <!-- Fan circle inside AHU -->
  <circle cx="130" cy="280" r="30" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  <path d="M 130 250 L 130 310 M 100 280 L 160 280" stroke="#0ea5e9" stroke-width="1.5"/>

  <!-- Supply Air Main Duct (Double Line Ducting) -->
  <!-- Main Trunk 600x400 -->
  <rect x="200" y="200" width="260" height="60" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
  <text x="230" y="235" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">MAIN SUPPLY DUCT 600x400</text>
  <text x="230" y="250" fill="#bae6fd" font-family="monospace" font-size="9">V = 6.2 m/s | Q = 3,200 CFM</text>

  <!-- Branch 1 (Upward) to Room 301 -->
  <rect x="320" y="90" width="50" height="110" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
  <text x="380" y="140" fill="#38bdf8" font-family="monospace" font-size="9">BRANCH 300x250</text>
  <!-- Diffuser 1 -->
  <rect x="305" y="60" width="80" height="30" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <line x1="305" y1="60" x2="385" y2="90" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="305" y1="90" x2="385" y2="60" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="290" y="50" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">DIFFUSER D-01 (600x600)</text>

  <!-- Branch 2 (Downward) to OT Room 302 -->
  <rect x="410" y="260" width="50" height="120" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
  <!-- HEPA Filter Terminal Unit -->
  <rect x="390" y="380" width="90" height="40" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <line x1="390" y1="380" x2="480" y2="420" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="390" y1="420" x2="480" y2="380" stroke="#22c55e" stroke-width="1.5"/>
  <text x="365" y="440" fill="#22c55e" font-family="monospace" font-size="9" font-weight="bold">HEPA FILTER BOX H-14</text>
  <text x="365" y="455" fill="#86efac" font-family="monospace" font-size="8">Efficiency 99.995% @ 0.3um</text>

  <!-- Duct Reducer Section -->
  <polygon points="460,200 520,215 520,245 460,260" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>

  <!-- Extended Duct 400x300 -->
  <rect x="520" y="215" width="160" height="30" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
  <text x="535" y="235" fill="#f8fafc" font-family="monospace" font-size="10">DUCT 400x300</text>

  <!-- Diffuser 2 -->
  <rect x="680" y="210" width="50" height="40" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <line x1="680" y1="210" x2="730" y2="250" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="680" y1="250" x2="730" y2="210" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="660" y="270" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">DIFFUSER D-02</text>

  <!-- Chilled Water Piping Lines (Blue for Supply, Green for Return) -->
  <line x1="60" y1="390" x2="200" y2="390" stroke="#0284c7" stroke-width="3"/>
  <text x="65" y="380" fill="#38bdf8" font-family="monospace" font-size="9">CHWS DN80 (SUPPLY 7°C)</text>

  <line x1="60" y1="415" x2="200" y2="415" stroke="#10b981" stroke-width="3"/>
  <text x="65" y="435" fill="#34d399" font-family="monospace" font-size="9">CHWR DN80 (RETURN 12°C)</text>

  <!-- Title Block Bottom Right -->
  <rect x="520" y="400" width="250" height="70" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
  <text x="530" y="418" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">GLACE HVAC & CLEANROOM</text>
  <text x="530" y="435" fill="#f8fafc" font-family="monospace" font-size="9">DWG: DWG-ME-HVAC-042 [REV A]</text>
  <text x="530" y="450" fill="#94a3b8" font-family="sans-serif" font-size="8">LAYOUT DUCTING RUANG BEDAH LT.3</text>
</svg>