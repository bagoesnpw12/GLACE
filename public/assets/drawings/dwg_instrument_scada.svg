<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-inst" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0a1220"/>
  <rect width="100%" height="100%" fill="url(#grid-inst)"/>

  <!-- Frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Title Top -->
  <text x="50" y="55" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">SKEMA WIRING INTERKONEKSI RTU SCADA & BAY CONTROL UNIT (BCU)</text>
  <text x="50" y="72" fill="#94a3b8" font-family="monospace" font-size="10">PROTOKOL KOMUNIKASI: IEC 61850 GOOSE & MODBUS TCP/IP REDUNDANT</text>

  <!-- RTU Cabinet Block (Remote Terminal Unit) -->
  <rect x="60" y="100" width="180" height="340" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="70" y="110" width="160" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="85" y="135" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">PANEL RTU-01</text>

  <!-- Terminal Blocks Inside RTU (TB-01, TB-02) -->
  <!-- TB-01 Digital Input (DI) -->
  <rect x="75" y="170" width="150" height="60" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="85" y="190" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">TB-01: DIGITAL INPUT</text>
  <circle cx="100" cy="210" r="4" fill="#f59e0b"/>
  <circle cx="130" cy="210" r="4" fill="#f59e0b"/>
  <circle cx="160" cy="210" r="4" fill="#f59e0b"/>
  <circle cx="190" cy="210" r="4" fill="#f59e0b"/>

  <!-- TB-02 Analog Input 4-20mA -->
  <rect x="75" y="250" width="150" height="60" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="85" y="270" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">TB-02: ANALOG (4-20mA)</text>
  <circle cx="100" cy="290" r="4" fill="#22c55e"/>
  <circle cx="130" cy="290" r="4" fill="#22c55e"/>
  <circle cx="160" cy="290" r="4" fill="#22c55e"/>
  <circle cx="190" cy="290" r="4" fill="#22c55e"/>

  <!-- Power Supply 110V DC -->
  <rect x="75" y="330" width="150" height="50" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="85" y="355" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">POWER 110V DC DUAL</text>

  <!-- Industrial Ethernet Switch (Redundant Ring) -->
  <rect x="330" y="110" width="140" height="100" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="345" y="135" fill="#a855f7" font-family="monospace" font-size="11" font-weight="bold">SWITCH SCADA</text>
  <text x="345" y="152" fill="#94a3b8" font-family="monospace" font-size="9">Managed Switch PRP/HSR</text>
  <!-- RJ45 Ports -->
  <rect x="345" y="170" width="18" height="15" fill="#a855f7"/>
  <rect x="375" y="170" width="18" height="15" fill="#a855f7"/>
  <rect x="405" y="170" width="18" height="15" fill="#a855f7"/>
  <rect x="435" y="170" width="18" height="15" fill="#a855f7"/>

  <!-- Bay Control Unit (BCU) Panel -->
  <rect x="560" y="100" width="180" height="340" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="570" y="110" width="160" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="590" y="135" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">PANEL BCU BAY 1</text>

  <rect x="575" y="170" width="150" height="60" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="585" y="190" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">CB TRIP / CLOSE CMD</text>

  <rect x="575" y="250" width="150" height="60" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="585" y="270" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">CT/PT METERING INPUT</text>

  <!-- Fiber Optic & Ethernet Connections -->
  <line x1="240" y1="130" x2="330" y2="130" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="250" y="122" fill="#a855f7" font-family="monospace" font-size="9">FO 1 Gbps</text>

  <line x1="470" y1="130" x2="560" y2="130" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="480" y="122" fill="#a855f7" font-family="monospace" font-size="9">FO 1 Gbps</text>

  <!-- Hardwire Multi-core Cable Wiring (Shielded Twisted Pair) -->
  <path d="M 190 210 L 290 210 L 290 320 L 575 320" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="310" y="312" fill="#f59e0b" font-family="monospace" font-size="9">KABEL NYCY 12 x 2.5 mm² (STATUS CB/DS)</text>

  <path d="M 190 290 L 310 290 L 310 360 L 575 360" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="320" y="352" fill="#22c55e" font-family="monospace" font-size="9">KABEL INDIVIDUALLY SHIELDED 4-20mA (MW/MVAR)</text>

  <!-- Title Block Bottom Right -->
  <rect x="520" y="400" width="250" height="70" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="530" y="418" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">GLACE INSTRUMENTATION</text>
  <text x="530" y="435" fill="#f8fafc" font-family="monospace" font-size="9">DWG: DWG-IN-SCD-008 [REV A]</text>
  <text x="530" y="450" fill="#94a3b8" font-family="sans-serif" font-size="8">WIRING INTERKONEKSI SCADA & BCU</text>
</svg>