<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <rect width="400" height="250" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="360" height="210" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="6"/>
  <!-- Linear Guide Rail (Horizontal Steel Profile) -->
  <rect x="50" y="115" width="300" height="35" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <line x1="50" y1="125" x2="350" y2="125" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="350" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Rail mounting holes -->
  <circle cx="80" cy="132" r="4" fill="#475569"/>
  <circle cx="320" cy="132" r="4" fill="#475569"/>
  <!-- Linear Guide Carriage Block (Heavy Duty Steel Block) -->
  <rect x="130" y="80" width="140" height="85" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- End seals (Red/Green precision seals) -->
  <rect x="130" y="80" width="12" height="85" rx="2" fill="#ef4444"/>
  <rect x="258" y="80" width="12" height="85" rx="2" fill="#ef4444"/>
  <!-- Top 4 threaded mounting holes -->
  <circle cx="165" cy="100" r="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="225" cy="100" r="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="165" cy="140" r="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="225" cy="140" r="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Grease Nipple fitting in front -->
  <rect x="195" y="70" width="10" height="10" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <circle cx="200" cy="68" r="3" fill="#f59e0b"/>
</svg>