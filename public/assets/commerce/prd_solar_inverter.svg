<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <rect width="400" height="250" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="360" height="210" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="6"/>
  <!-- Solar Inverter Cabinet Body -->
  <rect x="90" y="50" width="220" height="145" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <!-- Cooling vents top & side -->
  <line x1="110" y1="65" x2="290" y2="65" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="110" y1="72" x2="290" y2="72" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="110" y1="79" x2="290" y2="79" stroke="#cbd5e1" stroke-width="2"/>
  <!-- LED Status indicators & Display Screen -->
  <rect x="150" y="100" width="100" height="40" rx="4" fill="#0f172a"/>
  <text x="200" y="125" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#22c55e">50.0 kW / 98.7%</text>
  <circle cx="125" cy="115" r="4" fill="#22c55e"/>
  <circle cx="125" cy="127" r="4" fill="#38bdf8"/>
  <!-- DC Disconnect Switch Switch knob -->
  <circle cx="275" cy="120" r="10" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
  <line x1="275" y1="113" x2="275" y2="127" stroke="#dc2626" stroke-width="3"/>
  <!-- Bottom Cable Glans (MC4 Solar Connectors) -->
  <rect x="120" y="195" width="12" height="10" fill="#475569"/>
  <rect x="145" y="195" width="12" height="10" fill="#475569"/>
  <rect x="170" y="195" width="12" height="10" fill="#475569"/>
  <rect x="195" y="195" width="12" height="10" fill="#475569"/>
  <rect x="220" y="195" width="12" height="10" fill="#475569"/>
  <rect x="245" y="195" width="12" height="10" fill="#475569"/>
  <rect x="270" y="195" width="12" height="10" fill="#475569"/>
</svg>