<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc" rx="16"/>
  <!-- Transformer Tank Body -->
  <rect x="50" y="80" width="100" height="70" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <!-- Cooling fins / radiator ribs -->
  <line x1="50" y1="95" x2="150" y2="95" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="110" x2="150" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="125" x2="150" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="140" x2="150" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <!-- High Voltage Bushings (3 Top Insulators matching screenshot) -->
  <rect x="68" y="55" width="12" height="25" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <circle cx="74" cy="53" r="3" fill="#dc2626"/>
  <rect x="94" y="55" width="12" height="25" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <circle cx="100" cy="53" r="3" fill="#dc2626"/>
  <rect x="120" y="55" width="12" height="25" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <circle cx="126" cy="53" r="3" fill="#dc2626"/>
  <!-- Base Skid Support -->
  <rect x="42" y="150" width="116" height="8" rx="2" fill="#64748b"/>
</svg>