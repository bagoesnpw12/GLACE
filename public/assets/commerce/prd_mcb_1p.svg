<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background card canvas -->
  <rect width="200" height="200" fill="#f8fafc" rx="16"/>
  <!-- MCB Outer Body -->
  <rect x="75" y="40" width="50" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Top terminal terminal slot -->
  <rect x="85" y="45" width="30" height="12" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="100" cy="51" r="3" fill="#64748b"/>
  <!-- Bottom terminal -->
  <rect x="85" y="143" width="30" height="12" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="100" cy="149" r="3" fill="#64748b"/>
  <!-- Switch toggle recess -->
  <rect x="86" y="80" width="28" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Orange/Red switch lever (matching screenshot orange toggle) -->
  <rect x="91" y="90" width="18" height="20" rx="4" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="2.5" fill="#ffffff"/>
  <!-- Rating text marker -->
  <text x="100" y="73" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#059669">C6 230V</text>
  <text x="100" y="134" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#64748b">6000A</text>
</svg>