<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc" rx="16"/>
  <!-- Panel Enclosure Body (Double door matching screenshot) -->
  <rect x="55" y="45" width="90" height="115" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
  <!-- Plinth base -->
  <rect x="50" y="160" width="100" height="10" rx="2" fill="#94a3b8"/>
  <!-- Center vertical divider for 2 doors -->
  <line x1="100" y1="45" x2="100" y2="160" stroke="#64748b" stroke-width="2"/>
  <!-- Left door handle -->
  <rect x="91" y="95" width="4" height="15" rx="1" fill="#64748b"/>
  <!-- Right door handle -->
  <rect x="105" y="95" width="4" height="15" rx="1" fill="#64748b"/>
  <!-- Top eyebolts for lifting -->
  <circle cx="68" cy="40" r="4" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="132" cy="40" r="4" fill="none" stroke="#64748b" stroke-width="2"/>
  <!-- Ventilation louvres at bottom of doors -->
  <line x1="65" y1="140" x2="88" y2="140" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="65" y1="145" x2="88" y2="145" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="112" y1="140" x2="135" y2="140" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="112" y1="145" x2="135" y2="145" stroke="#cbd5e1" stroke-width="1.5"/>
</svg>