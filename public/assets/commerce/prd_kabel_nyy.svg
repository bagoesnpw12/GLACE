<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc" rx="16"/>
  <!-- Cable Roll Ellipses in Isometric View (matching screenshot) -->
  <g transform="translate(100, 105)">
    <!-- Outer coil ellipse -->
    <ellipse cx="0" cy="0" rx="60" ry="32" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <ellipse cx="0" cy="12" rx="60" ry="32" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <path d="M -60 0 L -60 12 A 60 32 0 0 0 60 12 L 60 0" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/>
    <!-- Inner coil hole -->
    <ellipse cx="0" cy="6" rx="28" ry="15" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
    <!-- Cable end tip -->
    <path d="M 45 10 Q 55 25 70 20" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>